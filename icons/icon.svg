<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f3f4f6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Notebook Card -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Pen / Sparkle accent decoration -->
  <circle cx="140" cy="148" r="14" fill="#4f46e5" />
  <rect x="176" y="140" width="180" height="16" rx="8" fill="#1e293b" />
  
  <rect x="140" y="196" width="232" height="14" rx="7" fill="#64748b" opacity="0.8" />
  <rect x="140" y="244" width="190" height="14" rx="7" fill="#64748b" opacity="0.8" />
  <rect x="140" y="292" width="220" height="14" rx="7" fill="#64748b" opacity="0.8" />

  <!-- Checkbox item -->
  <rect x="140" y="340" width="20" height="20" rx="6" fill="#10b981" />
  <path d="M145 350 L149 354 L156 345" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="176" y="343" width="130" height="14" rx="7" fill="#94a3b8" />

  <!-- Glowing Corner Pencil Badge -->
  <circle cx="370" cy="370" r="44" fill="#4f46e5" filter="url(#shadow)" />
  <path d="M360 380 L356 384 L354 394 L364 392 L368 388 Z" fill="#fbbf24" />
  <path d="M361 379 L378 362 C381 359 385 359 388 362 L392 366 C395 369 395 373 392 376 L375 393 Z" fill="#ffffff" />
</svg>
